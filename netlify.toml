[build]
  command = "npm run build:netlify"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Set real values in Netlify UI (Site settings → Environment variables).
  # Names expected by the API function:
  # SUPABASE_URL
  # SUPABASE_ANON_KEY

[functions]
  # zisi keeps process.env dynamic (esbuild can bake empty env at build time)
  node_bundler = "zisi"
  included_files = ["server/src/**"]

# API must win over SPA fallback (! = force)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# React Router SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false