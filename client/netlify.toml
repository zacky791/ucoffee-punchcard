[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Empty = same-origin /api → Netlify Functions (root netlify.toml).
  # Do not point at the old Render punch-only service — it has no POS inventory routes.
  VITE_API_URL = ""
  VITE_STAFF_PIN = "9897"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
